version: '3.8'

services:

  #  API Gateway 
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - product-service
      - cart-service
      - payment-service
      - notification-service
    networks:
      - boutique-network

  #  Product Service 
  product-service:
    build: ./product-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - boutique-network
    restart: unless-stopped

  #  Cart Service 
  cart-service:
    build: ./cart-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    networks:
      - boutique-network
    restart: unless-stopped

  # Payment Service 
  payment-service:
    build: ./payment-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    networks:
      - boutique-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build: ./notification-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
    networks:
      - boutique-network
    restart: unless-stopped

networks:
  boutique-network:
    driver: bridge